<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
const q=new URLSearchParams(location.search);
const W=parseInt(q.get('w')||'1100'),H=1080;
const BG=parseInt(q.get('bg')||'E9E9F5',16), FLOOR=parseInt(q.get('floor')||'D7D7EA',16), COL=parseInt(q.get('piece')||'690D0E',16), GOLD=0xE0A93B;
const mode=q.get('mode')||'bars';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(W,H);

document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(BG);sc.fog=new THREE.Fog(BG,22,44);

const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-6,14,10);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);

const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.38,metalness:.05});
function add(m){m.castShadow=true;m.receiveShadow=true;sc.add(m);return m;}
if(mode==='bars'){
  const vals=(q.get('v')||'36,82,43').split(',').map(Number);
  vals.forEach((v,i)=>{const h=v/100*6;
    const g=new THREE.Mesh(new THREE.BoxGeometry(1.8,6,1.8),new THREE.MeshStandardMaterial({color:COL,roughness:.5,transparent:true,opacity:.13}));g.position.set(i*2.9,3,0);sc.add(g);
    add(new THREE.Mesh(new THREE.BoxGeometry(1.8,h,1.8),mat(COL))).position.set(i*2.9,h/2,0);});
  cam.position.set(-7.5,8.5,17.5);cam.lookAt(2.9,2.2,0);
}
if(mode==='pawns'){
  for(let i=0;i<5;i++){const c=i===2?GOLD:COL;const x=(i-2)*2.2;
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.75,0.95,0.35,48),mat(c))).position.set(x,0.18,0);
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.7,2.2,48),mat(c))).position.set(x,1.45,0);
    add(new THREE.Mesh(new THREE.SphereGeometry(0.62,48,32),mat(c))).position.set(x,3.0,0);}
  cam.position.set(-3.5,7.5,18);cam.lookAt(0,1.4,0);
}
if(mode==='steps'){
  for(let i=0;i<4;i++){const h=0.9+i*0.9;
    add(new THREE.Mesh(new THREE.BoxGeometry(2.2,h,2.6),mat(i===3?GOLD:COL))).position.set(i*2.3,h/2,0);}
  cam.position.set(-7,8,16.5);cam.lookAt(3.4,1.5,0);
}
if(mode==='flag'){
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,8,32),mat(0xD9D3CC))).position.set(0,4,0);
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.9,1.1,0.4,48),mat(0xD9D3CC))).position.set(0,0.2,0);
  const shape=new THREE.Shape();shape.moveTo(0,0);
  const pts=[];for(let i=0;i<=40;i++){const t=i/40;pts.push([t*4.2,Math.sin(t*Math.PI*1.6)*0.35]);}
  const geo=new THREE.PlaneGeometry(4.2,2.6,40,10);const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i)+2.1;p.setZ(i,Math.sin(x*1.3)*0.35*(x/4.2));}
  geo.computeVertexNormals();
  const f=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:GOLD,roughness:.5,side:THREE.DoubleSide}));f.position.set(2.2,6.6,0);f.castShadow=true;sc.add(f);
  cam.position.set(-6.5,6,17.5);cam.lookAt(1.6,3.8,0);
}
r.render(sc,cam);window.done=true;
</script></body></html>
