<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;color:#fff;position:relative;
background:linear-gradient(180deg,#0B0202 0%,#1E0405 30%,#4A0709 62%,#7E0D10 86%,#981316 100%)}
svg.c{position:absolute;left:0;top:0}
.brand{position:absolute;left:90px;right:90px;top:150px;display:flex;justify-content:space-between;font-size:24px;letter-spacing:.24em;font-weight:600;color:#B9A9C4}
.mon{position:absolute;left:90px;top:300px;width:640px;height:300px;border-radius:28px;background:#0E0F12;border:3px solid #2E2C36;box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.6);padding:34px 44px;box-sizing:border-box}
.mon .lb{font-size:38px;font-weight:700;color:#7FE0B8;letter-spacing:.04em}
.mon .lb small{font-size:24px;color:#5DA98A;margin-left:10px;font-weight:500}
.mon .v{font-size:170px;font-weight:800;line-height:1;color:#8FF0C6;text-shadow:0 0 28px rgba(143,240,198,.45);margin-top:6px}
.mon .wave{position:absolute;right:36px;bottom:42px}
.q{position:absolute;left:90px;right:70px;top:700px;font-size:96px;line-height:1.0;font-weight:900;text-transform:uppercase;letter-spacing:-1px}
.red{color:#B9B6E3}
.pill{position:absolute;left:90px;top:1100px;background:#C8191C;color:#fff;font-size:34px;font-weight:700;padding:16px 38px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.art{position:absolute;right:-60px;top:1180px;width:520px;opacity:.5}
.ph{position:absolute;left:90px;top:1350px;width:300px;height:300px;border-radius:50%;overflow:hidden;border:6px solid rgba(255,255,255,.08)}
.ph img{width:100%;height:100%;object-fit:cover}
.nm{position:absolute;left:90px;top:1670px;font-size:30px;font-weight:600;color:#E8E1EC}
.nm small{display:block;font-size:24px;font-weight:500;color:#C9C3DA;margin-top:4px}
</style></head><body>
<svg class="c" width="1080" height="1920"><circle cx="980" cy="120" r="330" stroke="rgba(255,255,255,.10)" stroke-width="2" fill="none"/></svg>
<div class="brand"><span>PROJETO CULTURA DE SEGURANÇA</span><span>AULA #12</span></div>
<div class="mon"><div class="lb">SpO₂<small>%</small></div><div class="v">99</div>
<svg class="wave" width="250" height="90" viewBox="0 0 250 90"><path d="M0 60 L40 60 L55 20 L70 75 L85 55 L130 60 L145 22 L160 75 L175 55 L220 60 L235 22 L250 60" stroke="#8FF0C6" stroke-width="5" fill="none" opacity=".85"/></svg></div>
<div class="q">Mas será que seu paciente está <span class="red">ventilando?</span></div>
<div class="pill">Aula #12 · quinta, 19/11, 11h11</div>
<img class="art" src="pretraq.png">
<div class="ph"><img src="carla-gamba.jpg"></div>
<div class="nm">Profa. Carla Gamba, MSc<small>Grupo Nitro</small></div>
</body></html>
