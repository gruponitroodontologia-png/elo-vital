<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const P = new URLSearchParams(location.search);
const KIND = P.get('k')||'via';
const W = parseInt(P.get('w')||'1200'), H = parseInt(P.get('h')||'1080');
const TONE = P.get('tone')||'wine'; // wine | light
const WINE=0x690D0E, GOLD=0xE0A93B, LAV=0xA5A5D3, ROSE=0xF4D9D9;

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H); renderer.setClearColor(0x000000,0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0xe8dede, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-4,8,6); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe7c2, 1.4); rim.position.set(6,2,-5); scene.add(rim);

const camera = new THREE.PerspectiveCamera(30, W/H, 0.1, 100);

const glass = (color, op=0.55, rough=0.18) => new THREE.MeshPhysicalMaterial({
  color, transparent:true, opacity:op, roughness:rough, metalness:0.0, clearcoat:1, clearcoatRoughness:0.1,
  transmission:0.35, thickness:0.6, ior:1.35, side:THREE.DoubleSide, depthWrite:false});
const solid = (color, rough=0.35, metal=0.2) => new THREE.MeshPhysicalMaterial({color, roughness:rough, metalness:metal, clearcoat:0.6});

function tube(points, r, mat, seg=120){
  const curve = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 48, false), mat); scene.add(m); return {m,curve};
}
function rings(curve, r, n, mat, t0=0.04, t1=0.96){
  for(let i=0;i<n;i++){
    const t = t0+(t1-t0)*i/(n-1);
    const p = curve.getPointAt(t), tg = curve.getTangentAt(t);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, r*0.18, 16, 64, Math.PI*1.65), mat);
    ring.position.copy(p);
    ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), tg);
    ring.rotateZ(Math.PI*0.68);
    scene.add(ring);
  }
}

if (KIND==='via'){
  // árvore traqueobrônquica translúcida
  const trq = tube([[0,4.2,0],[0,2.6,0],[0,1.0,0],[0,0,0]], 0.55, glass(WINE,0.42));
  rings(trq.curve, 0.6, 11, glass(GOLD,0.85,0.25), 0.05, 0.95);
  const bR = tube([[0,0,0],[0.5,-0.6,0.05],[1.4,-1.4,0.1],[2.2,-2.6,0.2]], 0.38, glass(WINE,0.42));
  const bL = tube([[0,0,0],[-0.6,-0.5,0],[-1.6,-1.0,-0.1],[-2.5,-1.9,-0.2]], 0.36, glass(WINE,0.42));
  rings(bR.curve,0.42,4,glass(GOLD,0.8,0.25),0.25,0.8); rings(bL.curve,0.4,4,glass(GOLD,0.8,0.25),0.25,0.8);
  const twig=(o,dirs,r)=>dirs.forEach(d=>tube([o,[o[0]+d[0]*0.5,o[1]+d[1]*0.5,o[2]+d[2]*0.5],[o[0]+d[0],o[1]+d[1],o[2]+d[2]]], r, glass(WINE,0.32)));
  twig([2.2,-2.6,0.2],[[0.9,-0.6,0.2],[0.2,-1.1,-0.1],[1.0,0.1,-0.2]],0.2);
  twig([-2.5,-1.9,-0.2],[[-0.9,-0.7,0.1],[-0.2,-1.1,0.2],[-1.0,0.1,0.1]],0.2);
  // laringe estilizada
  const lar = new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.85,0.9,48,1,true), glass(ROSE,0.5)); lar.position.set(0,4.6,0); scene.add(lar);
  camera.position.set(3.6,1.4,17); camera.lookAt(0,0.9,0);
}
if (KIND==='som'){
  const trq = tube([[0,3.6,0],[0,1.2,0],[0,-1.2,0],[0,-3.6,0]], 0.75, glass(WINE,0.42));
  rings(trq.curve, 0.82, 10, glass(GOLD,0.85,0.25));
  for(let i=0;i<5;i++){
    const r=1.6+i*0.85;
    const w = new THREE.Mesh(new THREE.TorusGeometry(r, 0.05+0.02*(4-i), 16, 160), glass(i%2?LAV:GOLD, 0.75-i*0.12, 0.2));
    w.rotation.x = Math.PI/2; w.position.y = 0.6; scene.add(w);
  }
  camera.position.set(0,6.5,12.5); camera.lookAt(0,0,0);
}
if (KIND==='esteto'){
  // campânula (diafragma) do estetoscópio
  const bell = new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.75,0.5,96), glass(LAV,0.55,0.12)); scene.add(bell);
  const rimm = new THREE.Mesh(new THREE.TorusGeometry(1.72,0.16,24,120), solid(GOLD,0.25,0.8)); rimm.rotation.x=Math.PI/2; rimm.position.y=-0.15; scene.add(rimm);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.45,1.45,0.06,96), glass(0xffffff,0.35,0.05)); disc.position.y=-0.28; scene.add(disc);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.28,1.0,32), solid(GOLD,0.25,0.8)); stem.position.set(0,0.7,0); scene.add(stem);
  tube([[0,1.1,0],[0.2,2.2,0.2],[1.2,3.4,0.4],[2.8,3.9,0.2],[4.2,3.2,-0.2],[5.2,2.0,-0.4]], 0.17, glass(WINE,0.7,0.3));
  camera.position.set(-1.5,5.8,9.5); camera.lookAt(1.4,1.1,0);
}
if (KIND==='lua'){
  // crescente translúcido (sono)
  const s = new THREE.Shape(); s.absarc(0,0,2.4,Math.PI*0.25,Math.PI*1.75,false);
  const hole = new THREE.Path(); hole.absarc(1.0,0,2.0,Math.PI*1.75,Math.PI*0.25,true); s.holes=[];
  const crescent = new THREE.Shape(); crescent.absarc(0,0,2.4,0.973,5.310,false); crescent.absarc(1.1,0,2.0,4.838,1.445,true);
  const g = new THREE.ExtrudeGeometry(crescent,{depth:0.6,bevelEnabled:true,bevelThickness:0.18,bevelSize:0.14,bevelSegments:8,curveSegments:96});
  g.center(); const moon=new THREE.Mesh(g, glass(GOLD,0.7,0.15)); moon.rotation.set(-0.25,0.5,0.15); scene.add(moon);
  [[2.6,1.8,-0.5,0.22],[3.3,0.4,0.2,0.14],[2.2,-1.6,0.3,0.18]].forEach(([x,y,z,r])=>{const st=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1), glass(LAV,0.8,0.1)); st.position.set(x,y,z); scene.add(st);});
  camera.position.set(0,0.5,14); camera.lookAt(0.6,0,0);
}
if (KIND==='escudo'){
  const sh = new THREE.Shape(); sh.moveTo(0,2.6); sh.bezierCurveTo(1.4,2.2,2.2,2.3,2.4,2.0); sh.lineTo(2.2,0.0); sh.bezierCurveTo(1.9,-1.6,0.9,-2.4,0,-2.9); sh.bezierCurveTo(-0.9,-2.4,-1.9,-1.6,-2.2,0.0); sh.lineTo(-2.4,2.0); sh.bezierCurveTo(-2.2,2.3,-1.4,2.2,0,2.6);
  const g=new THREE.ExtrudeGeometry(sh,{depth:0.5,bevelEnabled:true,bevelThickness:0.2,bevelSize:0.16,bevelSegments:10,curveSegments:96}); g.center();
  const m=new THREE.Mesh(g, glass(WINE,0.55,0.12)); m.rotation.set(-0.15,0.45,0); scene.add(m);
  const cross1=new THREE.Mesh(new RoundedBoxGeometry(0.5,2.0,0.5,4,0.12), solid(GOLD,0.25,0.7)); cross1.position.z=0.5; cross1.rotation.set(-0.15,0.45,0); scene.add(cross1);
  const cross2=new THREE.Mesh(new RoundedBoxGeometry(2.0,0.5,0.5,4,0.12), solid(GOLD,0.25,0.7)); cross2.position.z=0.5; cross2.rotation.set(-0.15,0.45,0); scene.add(cross2);
  camera.position.set(0,0.4,13); camera.lookAt(0,0,0);
}
if (KIND==='perfil' || KIND==='pretraq'){
  const pts=[[-0.9,-4.2],[-0.95,-2.0],[-1.6,-1.2],[-2.2,0.0],[-2.3,1.2],[-1.9,2.4],[-1.0,3.1],[0.2,3.3],[1.3,2.9],[1.9,2.0],[2.1,1.2],[2.05,0.75],[2.3,0.3],[2.55,-0.15],[2.2,-0.35],[2.15,-0.55],[2.27,-0.8],[2.05,-1.0],[2.2,-1.25],[2.1,-1.55],[1.95,-1.9],[1.4,-2.05],[0.9,-2.2],[0.8,-2.6],[0.85,-4.2]];
  const sh=new THREE.Shape(); sh.moveTo(...pts[0]); sh.splineThru(pts.slice(1).map(p=>new THREE.Vector2(...p))); sh.lineTo(...pts[0]);
  const g=new THREE.ExtrudeGeometry(sh,{depth:1.6,bevelEnabled:true,bevelThickness:0.35,bevelSize:0.2,bevelSegments:10,curveSegments:120}); g.translate(0,0,-0.8);
  const head=new THREE.Mesh(g, glass(LAV,0.22,0.12)); scene.add(head);
  const grp=new THREE.Group(); scene.add(grp);
  // via aérea SUPRAGLÓTICA (cavidade nasal, nasofaringe, orofaringe, laringofaringe) — tom rosé
  const SUPRA=0xE27C80, INFRA=0x6E0A0D;
  tube([[2.3,-0.28,0],[1.6,-0.15,0],[0.6,-0.1,0],[-0.25,-0.3,0],[-0.45,-0.9,0],[-0.45,-1.5,0],[-0.32,-1.95,0],[-0.05,-2.25,0],[0.12,-2.42,0]],0.2,glass(SUPRA,0.72,0.2));
  // via aérea INFRAGLÓTICA (subglote e traqueia) — vinho profundo
  const inf=tube([[0.12,-2.42,0],[0.22,-2.75,0],[0.25,-3.2,0],[0.25,-4.25,0]],0.19,glass(INFRA,0.97,0.28));
  rings(inf.curve,0.215,6,glass(GOLD,0.9,0.25),0.42,0.96);
  // glote: plano das pregas vocais (limite supra × infraglótico)
  const gp=inf.curve.getPointAt(0.0), gt=inf.curve.getTangentAt(0.0);
  const glote=new THREE.Mesh(new THREE.TorusGeometry(0.21,0.035,16,64), solid(0xFFFFFF,0.25,0.1));
  glote.position.copy(gp); glote.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),gt); scene.add(glote);
  const dsc=new THREE.Mesh(new THREE.CircleGeometry(0.2,48), new THREE.MeshPhysicalMaterial({color:0xFFFFFF,transparent:true,opacity:0.35,side:THREE.DoubleSide,depthWrite:false}));
  dsc.position.copy(gp); dsc.quaternion.copy(glote.quaternion); scene.add(dsc);
  // cartilagem tireóidea (escudo anterior, translúcido) e anel cricoide
  const tir=new THREE.Mesh(new THREE.SphereGeometry(1,40,24,0,Math.PI*2,0,Math.PI*0.5), glass(0xD9D7E8,0.22,0.2));
  tir.scale.set(0.42,0.36,0.38); tir.rotation.z=-Math.PI/2-0.25; tir.position.set(0.2,-2.45,0); scene.add(tir);
  const cp=inf.curve.getPointAt(0.24), ct=inf.curve.getTangentAt(0.24);
  const cri=new THREE.Mesh(new THREE.TorusGeometry(0.23,0.07,16,64), glass(0xD9D7E8,0.85,0.2));
  cri.position.copy(cp); cri.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),ct); scene.add(cri);
  // esôfago (posterior)
  tube([[-0.35,-2.1,0],[-0.45,-2.8,0],[-0.45,-4.25,0]],0.14,glass(0x8a87a8,0.55,0.3));
  // língua
  const tg=new THREE.Mesh(new THREE.SphereGeometry(1,48,32), glass(0xB84A4C,0.7,0.25)); tg.scale.set(0.95,0.5,0.55); tg.position.set(0.75,-1.05,0); tg.rotation.z=-0.35; scene.add(tg);
  // palato
  tube([[2.0,-0.5,0],[1.0,-0.45,0],[0.1,-0.55,0],[-0.2,-0.75,0]],0.06,solid(0xF4D9D9,0.3,0.1));
  // EPIGLOTE: lâmina foliácea fixada atrás da base da língua, com a borda livre voltada para cima e para trás, sobre o ádito laríngeo
  const leaf=new THREE.Shape(); leaf.moveTo(0,0); leaf.bezierCurveTo(0.26,0.12,0.30,0.48,0.0,0.78); leaf.bezierCurveTo(-0.30,0.48,-0.26,0.12,0,0);
  const lg=new THREE.ExtrudeGeometry(leaf,{depth:0.05,bevelEnabled:true,bevelThickness:0.03,bevelSize:0.03,bevelSegments:4,curveSegments:48});
  const pos=lg.attributes.position; for(let i=0;i<pos.count;i++){const y=pos.getY(i), x=pos.getX(i); pos.setZ(i,pos.getZ(i)-0.9*x*x+0.25*y*y);} lg.computeVertexNormals();
  const epi=new THREE.Mesh(lg, solid(GOLD,0.3,0.25));
  epi.rotation.order='YXZ'; epi.rotation.y=Math.PI/2; epi.rotation.z=0; epi.rotation.x=0;
  const eg=new THREE.Group(); eg.add(epi); eg.position.set(0.2,-2.13,0); eg.rotation.z=0.38; eg.scale.setScalar(1.15); scene.add(eg);
  // valécula (prega entre a base da língua e a epiglote)
  window.ANCH={supra:[-0.45,-0.9,0],epi:[-0.08,-1.5,0],glote:[gp.x,gp.y,gp.z],infra:[0.25,-3.6,0],lingua:[0.9,-0.95,0]};
  // coluna cervical
  for(let i=0;i<7;i++){const v=new THREE.Mesh(new RoundedBoxGeometry(0.45,0.36,0.7,4,0.08), glass(0xD9D7E8,0.6,0.3)); v.position.set(-1.05,-0.9-i*0.46,0); scene.add(v);}
  camera.position.set(3.0,0.2,15.5); camera.lookAt(0.1,-0.4,0);
}
if (KIND==='bvm'){
  const bag=new THREE.Mesh(new THREE.SphereGeometry(1,64,48), glass(LAV,0.5,0.12)); bag.scale.set(1.9,1.05,1.05); bag.position.set(-1.2,0.4,0); scene.add(bag);
  const res=new THREE.Mesh(new THREE.SphereGeometry(1,48,32), glass(0xD9D7E8,0.35,0.2)); res.scale.set(1.2,0.8,0.8); res.position.set(-4.6,0.2,0); scene.add(res);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.9,32), glass(0xD9D7E8,0.6,0.2)); neck.rotation.z=Math.PI/2; neck.position.set(-3.4,0.3,0); scene.add(neck);
  const valve=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,1.3,48), solid(WINE,0.3,0.2)); valve.rotation.z=Math.PI/2; valve.position.set(1.25,0.4,0); scene.add(valve);
  const elbow=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.24,24,48,Math.PI/2), solid(WINE,0.3,0.2)); elbow.position.set(1.9,-0.15,0); elbow.rotation.z=0; scene.add(elbow);
  const port=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.5,32), solid(WINE,0.3,0.2)); port.position.set(2.45,-0.45,0); scene.add(port);
  const mask=new THREE.Mesh(new THREE.CylinderGeometry(0.3,1.25,1.0,64,1,true), glass(0xffffff,0.45,0.05)); mask.position.set(2.45,-1.15,0); scene.add(mask);
  const cush=new THREE.Mesh(new THREE.TorusGeometry(1.25,0.2,24,96), glass(WINE,0.75,0.2)); cush.rotation.x=Math.PI/2; cush.position.set(2.45,-1.66,0); scene.add(cush);
  tube([[-5.8,0.2,0],[-6.4,-0.4,0.2],[-6.6,-1.6,0.3]],0.07,glass(0x8a87a8,0.8,0.3));
  camera.position.set(-1.0,3.6,12.5); camera.lookAt(-1.0,-0.3,0);
}
if (KIND==='pretraq'){
  // estetoscópio pré-traqueal: campânula metálica na fúrcula, sobre a traqueia
  const chrome=new THREE.MeshPhysicalMaterial({color:0xd9d9e6,metalness:1.0,roughness:0.18,clearcoat:1});
  const bellG=new THREE.CylinderGeometry(0.42,0.62,0.55,64); const bell=new THREE.Mesh(bellG,chrome);
  bell.rotation.z=Math.PI/2; bell.position.set(1.22,-3.55,0); scene.add(bell);
  const lip=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.07,16,64),chrome); lip.rotation.y=Math.PI/2; lip.position.set(0.95,-3.55,0); scene.add(lip);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.4,24),chrome); stem.rotation.z=Math.PI/2; stem.position.set(1.65,-3.55,0); scene.add(stem);
  // tubo até o fone auricular único
  tube([[1.8,-3.55,0],[2.7,-3.5,0.2],[3.6,-3.0,0.4],[4.4,-2.0,0.5],[5.6,-1.4,0.6],[7.5,-1.2,0.6]],0.09,glass(WINE,0.85,0.3));
  
  // ondas sonoras saindo da traqueia em direção à campânula
  for(let i=0;i<3;i++){const w=new THREE.Mesh(new THREE.TorusGeometry(0.35+i*0.22,0.025,12,64,Math.PI*0.9),glass(LAV,0.9-i*0.2,0.2)); w.rotation.y=Math.PI/2; w.rotation.x=0; w.position.set(0.55+i*0.12,-3.55,0); w.rotateZ(-Math.PI*0.45); scene.add(w);}
  camera.position.set(4.5,-0.6,15.5); camera.lookAt(0.6,-1.0,0);
}
if (P.get('zoom')==='1'){ camera.position.set(1.4,-1.7,6.2); camera.lookAt(0.0,-2.0,0); }
renderer.render(scene,camera);
if (window.ANCH){ scene.updateMatrixWorld(); camera.updateMatrixWorld(); const o={}; for(const [k,v] of Object.entries(window.ANCH)){const p=new THREE.Vector3(...v).project(camera); o[k]=[Math.round((p.x+1)/2*W),Math.round((1-p.y)/2*H)];} console.log('ANCH '+JSON.stringify(o)); }
document.title='ok';
</script></body></html>
