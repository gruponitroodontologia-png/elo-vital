<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../esquemas-crianca/base.css">
<style>
.wrap{position:absolute;left:96px;top:110px;right:96px}
.savo{position:absolute;right:96px;top:44px;background:var(--wine);color:#fff;font-size:20px;font-weight:600;letter-spacing:.08em;padding:10px 22px;border-radius:999px}
.savo b{color:var(--gold)}
svg{position:absolute;left:60px;top:300px}
</style></head><body>
<div class="top">AULA #12 · A CRIANÇA HÍGIDA</div>
<div class="savo">APROFUNDAMENTO NO <b>SAVO</b> · POPULAÇÕES ESPECIAIS</div>
<div class="wrap">
  <div class="kick" style="margin-top:20px">Fisiologia respiratória e etiologia da parada</div>
  <h1>Consumo maior, reserva menor.</h1>
</div>
<svg width="1800" height="660" viewBox="0 0 1800 660">
  <!-- painel 1: consumo de O2 -->
  <text x="250" y="24" class="cap" text-anchor="middle" style="font-size:22px">CONSUMO DE O₂ EM REPOUSO</text>
  <g transform="translate(60,60)">
    <line x1="0" y1="420" x2="380" y2="420" stroke="#8a87a8" stroke-width="2"/>
    <rect x="40" y="60" width="120" height="360" fill="#690D0E"/>
    <rect x="220" y="240" width="120" height="180" fill="#A5A5D3"/>
    <text x="100" y="44" text-anchor="middle" style="font:800 40px Poppins;fill:#690D0E">6</text>
    <text x="280" y="224" text-anchor="middle" style="font:800 40px Poppins;fill:#6E6A8E">3</text>
    <text x="100" y="456" text-anchor="middle" class="lblb">lactente</text>
    <text x="280" y="456" text-anchor="middle" class="lblb" style="fill:#6E6A8E">adulto</text>
    <text x="190" y="500" text-anchor="middle" class="lbl">mL/kg/min · capacidade residual</text>
    <text x="190" y="528" text-anchor="middle" class="lbl">funcional proporcionalmente menor</text>
  </g>
  <!-- painel 2: dessaturação -->
  <text x="890" y="24" class="cap" text-anchor="middle" style="font-size:22px">APNEIA ATÉ SpO₂ 90%</text>
  <g transform="translate(560,60)">
    <text x="0" y="70" class="lblb">0–6 meses</text>
    <rect x="200" y="44" width="152" height="40" fill="#690D0E"/>
    <text x="364" y="74" class="lblb">96 s</text>
    <text x="0" y="190" class="lblb">2–5 anos</text>
    <rect x="200" y="164" width="252" height="40" fill="#B84A4C"/>
    <text x="464" y="194" class="lblb">160 s</text>
    <text x="0" y="310" class="lblb">11–18 anos</text>
    <rect x="200" y="284" width="400" height="40" fill="#A5A5D3"/>
    <text x="612" y="314" class="lblb" style="fill:#6E6A8E">382 s</text>
    <text x="330" y="420" text-anchor="middle" class="lbl">crianças ASA I, após pré-oxigenação</text>
    <text x="330" y="448" text-anchor="middle" class="lbl">Patel et al., Can J Anaesth, 1994</text>
  </g>
  <!-- painel 3: etiologia -->
  <text x="1530" y="24" class="cap" text-anchor="middle" style="font-size:22px">PCR EXTRA-HOSPITALAR · 0–17 ANOS</text>
  <g transform="translate(1530,270)">
    <circle r="170" fill="none" stroke="#A5A5D3" stroke-width="60"/>
    <circle r="170" fill="none" stroke="#690D0E" stroke-width="60" stroke-dasharray="758.4 1068.1" transform="rotate(-90)"/>
    <text y="0" text-anchor="middle" style="font:800 68px Poppins;fill:#690D0E">71%</text>
    <text y="50" text-anchor="middle" class="lblb" style="font-size:21px">causas não</text><text y="76" text-anchor="middle" class="lblb" style="font-size:21px">cardíacas</text>
    <text y="280" text-anchor="middle" class="lbl">5.170 crianças · Japão, 2005–2007</text>
    <text y="308" text-anchor="middle" class="lbl">Kitamura et al., Lancet, 2010</text>
  </g>
  <text x="900" y="640" text-anchor="middle" style="font:600 26px Poppins;fill:#2A2526">Na criança, a parada cardíaca é, com maior frequência, o desfecho de uma falência respiratória.</text>
</svg>
<div class="refs">Harless, Ramaiah, Bhananker, 2014 · Patel, Lenczyk, Hannallah, McGill, 1994 · Kitamura et al., 2010 · Lomez et al., Arch Argent Pediatr, 2024</div>
<div class="num">11</div>
</body></html>
