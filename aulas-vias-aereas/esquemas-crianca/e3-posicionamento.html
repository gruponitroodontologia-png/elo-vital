<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.wrap{position:absolute;left:96px;top:110px;right:96px}
.savo{position:absolute;right:96px;top:44px;background:var(--wine);color:#fff;font-size:20px;font-weight:600;letter-spacing:.08em;padding:10px 22px;border-radius:999px}
.savo b{color:var(--gold)}
svg{position:absolute;left:60px;top:300px}
</style></head><body>
<div class="top">AULA #12 · A CRIANÇA HÍGIDA</div>
<div class="savo">APROFUNDAMENTO NO <b>SAVO</b> · POPULAÇÕES ESPECIAIS</div>
<div class="wrap">
  <div class="kick" style="margin-top:20px">Occipício, decúbito e permeabilidade da via aérea</div>
  <h1>Em decúbito, o occipício flexiona o pescoço.</h1>
</div>
<svg width="1800" height="640" viewBox="0 0 1800 640">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#690D0E"/></marker></defs>
  <!-- painel A: superfície plana -->
  <text x="420" y="30" class="cap" text-anchor="middle" style="font-size:24px">SUPERFÍCIE PLANA</text>
  <g transform="translate(60,80)">
    <rect x="0" y="330" width="760" height="18" rx="6" fill="#D9D7E8"/>
    <!-- corpo -->
    <rect x="300" y="250" width="440" height="80" rx="40" fill="#F4E6E6" stroke="#690D0E" stroke-width="3"/>
    <!-- cabeça grande, apoiada no occipício, com o queixo em direção ao tórax -->
    <circle cx="190" cy="220" r="110" fill="#F4E6E6" stroke="#690D0E" stroke-width="3"/>
    <path d="M150,110 C110,140 92,190 100,250" fill="none" stroke="#E0A93B" stroke-width="10" stroke-linecap="round"/>
    <!-- pescoço flexionado -->
    <path d="M262,285 C280,300 300,300 310,290" fill="none" stroke="#690D0E" stroke-width="3"/>
    <!-- via aérea dobrada -->
    <path d="M250,200 C268,240 272,270 300,290 L430,290" fill="none" stroke="#B84A4C" stroke-width="10" stroke-linecap="round"/>
    <!-- língua obstruindo -->
    <ellipse cx="258" cy="232" rx="30" ry="18" fill="#B84A4C" stroke="#690D0E" stroke-width="2" transform="rotate(50 258 232)"/>
    <line x1="420" y1="130" x2="275" y2="225" stroke="#690D0E" stroke-width="2" marker-end="url(#ar)"/>
    <text x="430" y="120" class="lblb">Flexão cervical</text>
    <text x="430" y="148" class="lbl">a base da língua se desloca</text>
    <text x="430" y="174" class="lbl">sobre a orofaringe: obstrução</text>
  </g>
  <line x1="900" y1="20" x2="900" y2="460" stroke="#A5A5D3" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- painel B: coxim sob os ombros -->
  <text x="1340" y="30" class="cap" text-anchor="middle" style="font-size:24px">COXIM SOB OS OMBROS</text>
  <g transform="translate(980,80)">
    <rect x="0" y="330" width="760" height="18" rx="6" fill="#D9D7E8"/>
    <rect x="250" y="275" width="200" height="55" rx="22" fill="#E0A93B" stroke="#690D0E" stroke-width="3"/>
    <text x="350" y="310" text-anchor="middle" style="font:700 20px Poppins;fill:#690D0E">coxim</text>
    <rect x="300" y="200" width="440" height="80" rx="40" fill="#F4E6E6" stroke="#690D0E" stroke-width="3"/>
    <circle cx="180" cy="215" r="110" fill="#F4E6E6" stroke="#690D0E" stroke-width="3"/>
    <path d="M110,140 C82,180 80,230 98,275" fill="none" stroke="#E0A93B" stroke-width="10" stroke-linecap="round"/>
    <!-- via aérea alinhada -->
    <path d="M230,215 C260,232 280,238 310,240 L430,240" fill="none" stroke="#2f7d5b" stroke-width="10" stroke-linecap="round"/>
    <line x1="430" y1="110" x2="290" y2="232" stroke="#690D0E" stroke-width="2" marker-end="url(#ar)"/>
    <text x="440" y="100" class="lblb">Posição neutra</text>
    <text x="440" y="128" class="lbl">alinhamento dos eixos oral,</text>
    <text x="440" y="154" class="lbl">faríngeo e laríngeo</text>
  </g>
  <text x="900" y="520" text-anchor="middle" style="font:600 26px Poppins;fill:#2A2526">Na criança pequena, a cabeça proporcionalmente maior exige um coxim sob os ombros,</text>
  <text x="900" y="558" text-anchor="middle" style="font:600 26px Poppins;fill:#2A2526">e não sob a cabeça, para restituir a posição neutra.</text>
</svg>
<div class="refs">Esquema ilustrativo, sem escala · Harless, Ramaiah, Bhananker, Int J Crit Illn Inj Sci, 2014 (fig. 1)</div>
<div class="num">E3</div>
</body></html>
